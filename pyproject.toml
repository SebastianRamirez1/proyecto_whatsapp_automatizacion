[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pedidos-whatsapp-mcp"
version = "0.1.0"
description = "MCP server — gestión de pedidos WhatsApp por lenguaje natural"
readme = "mcp_server/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "whatsapp", "orders", "fastapi", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
pedidos-whatsapp-mcp = "mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/SebastianRamirez1/proyecto_whatsapp_automatizacion"
Repository = "https://github.com/SebastianRamirez1/proyecto_whatsapp_automatizacion"

[tool.setuptools.packages.find]
include = ["mcp_server*"]
